name: umbrella

services:
  umbrella:
    image: ${UMBRELLA_IMAGE:-umbrella-monitoring:latest}
    pull_policy: build
    build:
      context: ../../app
      args:
        VERSION: ${UMBRELLA_VERSION:-dev}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      UMBRELLA_SECURE_COOKIES: ${UMBRELLA_SECURE_COOKIES:-false}
      UMBRELLA_STARTUP_WAIT: ${UMBRELLA_STARTUP_WAIT:-2m}
    ports:
      - "${UMBRELLA_PORT:-8080}:8080"
    volumes:
      - umbrella-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [umbrella]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  umbrella:
    name: umbrella

volumes:
  umbrella-data:
