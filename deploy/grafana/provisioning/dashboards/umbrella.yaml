apiVersion: 1

providers:
  - name: umbrella
    orgId: 1
    folder: Beacon
    type: file
    disableDeletion: true
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/umbrella-dashboards

  # Current: the "CI traffic" dashboard (flow-ci-traffic.json) on the ClickHouse datasource.
  - name: umbrella-flow
    orgId: 1
    folder: Current
    type: file
    disableDeletion: true
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/flow-dashboards
